name: auth API CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "auth-api/**"

defaults:
  run:
    shell: bash
    working-directory: ./auth-api

jobs:
  setup-job:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - run: "true"

  linting:
    needs: setup-job
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install libsasl2-dev libldap2-dev libssl-dev --yes
          make setup
      - name: Lint with pylint
        id: pylint
        run: |
          make pylint
      - name: Lint with flake8
        id: flake8
        run: |
          make flake8


  testing:
    needs: setup-job
    env:
      FLASK_ENV: "testing"

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          make setup
      - name: Test
        id: test
        run: |
          make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: auth-api
          name: codecov-auth-api
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    # needs: PyTest
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    name: Build
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build
        run: |
          docker build . -t reports-api
