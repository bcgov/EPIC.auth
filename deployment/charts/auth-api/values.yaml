replicaCount: 1
cors_origin: https://dev.compliance.eao.gov.bc.ca
image:
  repository: image-registry.openshift-image-registry.svc:5000/c72cba-tools/auth-api  
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"
  namespace: c8b80a-tools

resources:
  cpu:
    limit: 250m
    request: 150m
  memory:
    limit: 250Mi
    request: 200Mi

database:
  secret: auth-patroni
  service:
    name: auth-patroni
    port: 5432



service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

auth:
  jwt:
    alg: RS256
    aud: auth-web
    cacheEnabled: true
    issuer: https://dev.loginproxy.gov.bc.ca/auth/realms/eao-epic
    cacheTimeout: "300"
    wellKnownConfig: https://dev.loginproxy.gov.bc.ca/auth/realms/eao-epic/.well-known/openid-configuration
  keycloak:
    uri: https://dev.loginproxy.gov.bc.ca
    realm: eao-epic
    adminClientId: epic-admin
    adminClientSecret: loPFwhTyMt3nGAYSsJ8XEfE3NrV6KDOu
python:
  pythonBuffered: 1
  connectTimeout: 60
cdogs:  
  tokenEndpoint: https://dev.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
  apiEndpoint: https://cdogs-test.api.gov.bc.ca/api/v2
  clientId: epic-admin
  clientSecret: Gr1oOpK13kkmmyK75cowoZastlnH9MN6
