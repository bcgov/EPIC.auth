apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: "{{ .Chart.Name }}"
  name: "{{ .Chart.Name }}"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ tpl .Values.image.repository . }}:{{ .Values.image.tag }}"
        resources:
          limits:
            cpu: {{ .Values.resources.cpu.limit }}
            memory: {{ .Values.resources.memory.limit }}
          requests:
            cpu: {{ .Values.resources.cpu.request }}
            memory: {{ .Values.resources.memory.request }}
        readinessProbe:
          httpGet:
            path: /api/readyz
            port: 8080
            scheme: HTTP
          timeoutSeconds: 10
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/healthz
            port: 8080
            scheme: HTTP
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        env:
          - name: JWT_OIDC_ALGORITHMS
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_ALGORITHMS
          - name: JWT_OIDC_AUDIENCE
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_AUDIENCE
          - name: CORS_ORIGIN
            value: {{ .Values.cors_origin }}
          - name: JWT_OIDC_CACHING_ENABLED
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_CACHING_ENABLED
          - name: JWT_OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_ISSUER
          - name: JWT_OIDC_JWKS_CACHE_TIMEOUT
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_JWKS_CACHE_TIMEOUT
          - name: JWT_OIDC_WELL_KNOWN_CONFIG
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: JWT_OIDC_WELL_KNOWN_CONFIG
          - name: PYTHONBUFFERED
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: PYTHONBUFFERED
          - name: CDOGS_TOKEN_END_POINT
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: CDOGS_TOKEN_END_POINT
          - name: CDOGS_API_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: CDOGS_API_ENDPOINT
          - name: CDOGS_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Chart.Name }}
                key: CDOGS_CLIENT_ID
          - name: CDOGS_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Chart.Name }}
                key: CDOGS_CLIENT_SECRET
          - name: KEYCLOAK_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: KEYCLOAK_BASE_URL
          - name: KEYCLOAK_REALM_NAME
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: KEYCLOAK_REALM_NAME
          - name: KEYCLOAK_ADMIN_CLIENT
            valueFrom:
              secretKeyRef:
                name: {{ .Chart.Name }}
                key: KEYCLOAK_ADMIN_CLIENT
          - name: KEYCLOAK_ADMIN_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Chart.Name }}
                key: KEYCLOAK_ADMIN_SECRET
          - name: CONNECT_TIMEOUT
            valueFrom:
              configMapKeyRef:
                name: {{ .Chart.Name }}
                key: CONNECT_TIMEOUT
        ports:
          - containerPort: 8080
            protocol: TCP
        imagePullPolicy: {{ .Values.image.pullPolicy }}
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
